<!-- SOUS-BLOC C : MOTEUR D'INJECTION MODULABLE (DÈS JANVIER 2027) -->
<div class="bg-zinc-950/70 border border-zinc-850 rounded-xl p-3.5 space-y-3">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
    <div>
      <span class="text-xs font-semibold text-zinc-300 block">Module d'Injection Personnalisable</span>
      <span class="text-[10px] text-zinc-500">Ajuste les montants réels avant de valider l'apport</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs font-mono text-zinc-400">Total : <strong class="text-emerald-400 font-bold" id="dca-total-preview">1 500 €</strong></span>
      <button onclick="injectCustomDCA()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow-lg shadow-emerald-950/50">
        <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Injecter
      </button>
    </div>
  </div>

  <!-- Champs éditables par actif -->
  <div class="grid grid-cols-3 gap-2 pt-1">
    <div>
      <label class="text-[10px] text-sky-400 block mb-1 font-mono">Apport Cash (€)</label>
      <input type="number" id="input-dca-cash" value="750" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-white focus:border-sky-500 outline-none font-mono" oninput="updateDcaPreview()" />
    </div>
    <div>
      <label class="text-[10px] text-emerald-400 block mb-1 font-mono">Apport PEA (€)</label>
      <input type="number" id="input-dca-pea" value="600" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-white focus:border-emerald-500 outline-none font-mono" oninput="updateDcaPreview()" />
    </div>
    <div>
      <label class="text-[10px] text-amber-400 block mb-1 font-mono">Apport Crypto (€)</label>
      <input type="number" id="input-dca-crypto" value="150" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-white focus:border-amber-500 outline-none font-mono" oninput="updateDcaPreview()" />
    </div>
  </div>

  <!-- Barre de répartition dynamique -->
  <div class="space-y-1 pt-1">
    <div class="flex justify-between text-[10px] font-mono text-zinc-400" id="dca-ratios-label">
      <span class="text-sky-400">Cash 50%</span>
      <span class="text-emerald-400">PEA 40%</span>
      <span class="text-amber-400">Crypto 10%</span>
    </div>
    <div class="w-full h-1.5 flex rounded-full overflow-hidden bg-zinc-900">
      <div id="bar-dca-cash" class="bg-sky-500" style="width: 50%"></div>
      <div id="bar-dca-pea" class="bg-emerald-500" style="width: 40%"></div>
      <div id="bar-dca-crypto" class="bg-amber-500" style="width: 10%"></div>
    </div>
  </div>

  <!-- Journal des injections -->
  <div class="border-t border-zinc-900 pt-2 space-y-1.5">
    <div class="flex justify-between items-center text-[11px] text-zinc-400 font-semibold">
      <span>Journal des Versements</span>
      <span class="text-zinc-500 font-mono text-[10px]" id="dca-history-count">0 injection(s)</span>
    </div>
    <div id="dca-history-list" class="space-y-1 max-h-24 overflow-y-auto text-[11px] pr-1"></div>
  </div>
</div>
